name: Build Android Debug APK

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant gradlew execute permission
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew --stacktrace assembleDebug

      - name: Prepare debug APK asset
        run: cp app/build/outputs/apk/debug/app-debug.apk shield-streaming-app-debug.apk

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: shield-streaming-app-debug-apk
          path: shield-streaming-app-debug.apk
          if-no-files-found: error

      - name: Publish rolling debug build
        if: github.event_name != 'pull_request' && (github.ref_name == 'main' || github.ref_name == 'master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-debug
          name: Latest Debug Build
          body: |
            Rolling debug APK build from `${{ github.sha }}`.

            Install/update using the attached `shield-streaming-app-debug.apk`.
          files: shield-streaming-app-debug.apk
          prerelease: true
          make_latest: false
